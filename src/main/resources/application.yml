server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/homeservicedb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root@39
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  # Flyway removed - Hibernate will manage schema (ddl-auto: update)

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
